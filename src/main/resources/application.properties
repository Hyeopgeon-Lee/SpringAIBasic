spring.application.name=SpringAIBasic

# none | iris | ocr | student
demo.mode=${DEMO_MODE:none}

# Iris classifier parameters (cm): sepal length/width and petal length/width.
iris.sepal-length=${IRIS_SEPAL_LENGTH:5.1}
iris.sepal-width=${IRIS_SEPAL_WIDTH:3.5}
iris.petal-length=${IRIS_PETAL_LENGTH:1.4}
iris.petal-width=${IRIS_PETAL_WIDTH:0.2}

# Oracle (the iris and ocr examples do NOT query this database).
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/xe}
spring.datasource.username=${DB_USERNAME:poly}
spring.datasource.password=${DB_PASSWORD:}

mybatis.type-aliases-package=kopo.poly.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

ocr.tessdata.path=${OCR_TESSDATA_PATH:C:/model/tessdata}
