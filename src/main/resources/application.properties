spring.application.name=SpringAIBasic

# none | sentiment | sentiment-batch | ocr | student
demo.mode=${DEMO_MODE:none}

# The actual .keras model is hosted by the separate koSent FastAPI application.
# In a real deployment configure an appropriate private, trusted API endpoint.
kosent.api.base-url=${KOSENT_API_URL:http://127.0.0.1:8000}
sentiment.text=${SENTIMENT_TEXT:정말 재미있고 감동적인 영화였습니다}

# Oracle database exercise (not needed for the sentiment example).
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/xe}
spring.datasource.username=${DB_USERNAME:poly}
spring.datasource.password=${DB_PASSWORD:}

mybatis.type-aliases-package=kopo.poly.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

# OCR exercise (not needed for the sentiment example).
ocr.tessdata.path=${OCR_TESSDATA_PATH:C:/model/tessdata}
