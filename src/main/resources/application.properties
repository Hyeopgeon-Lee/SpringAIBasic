spring.application.name=SpringAIBasic

# No demo is run automatically: avoids modifying database records on startup.
# Choose one of: none, student, ocr, nlp, ocr-nlp
demo.mode=${DEMO_MODE:none}

# Oracle database (override with environment variables in your own machine).
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/xe}
spring.datasource.username=${DB_USERNAME:poly}
spring.datasource.password=${DB_PASSWORD:}

# MyBatis XML mapper and DTO naming conventions.
mybatis.type-aliases-package=kopo.poly.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

# Directory containing kor.traineddata for Tess4J. Override on macOS/Linux.
ocr.tessdata.path=${OCR_TESSDATA_PATH:C:/model/tessdata}
